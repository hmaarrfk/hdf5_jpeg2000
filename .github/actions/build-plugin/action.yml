name: Build the plugin
description: >-
  Install HDF5, h5py, CMake and a compiler from conda-forge, build libojph
  (cached), and build and install the filter plugin.

inputs:
  coverage:
    description: Build the plugin with gcov instrumentation, for a coverage report.
    default: "false"

outputs:
  plugin-dir:
    description: The directory that holds the installed plugin.
    value: ${{ steps.plugin.outputs.plugin-dir }}

runs:
  using: composite
  steps:
    - name: Install the toolchain from conda-forge
      uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
      with:
        environment-name: h5jpeg2000
        create-args: >-
          python=3.13
          hdf5>=2,<3
          h5py
          numpy
          pytest
          ojph
          cmake
          ninja
          pkg-config
          ${{ runner.os != 'Windows' && 'cxx-compiler' || '' }}
          ${{ inputs.coverage == 'true' && 'gcovr' || '' }}
        condarc: |
          channels:
            - conda-forge
          channel_priority: strict
        init-shell: bash
        cache-environment: true
        post-cleanup: none

    - name: Check out libojph
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ramonaoptics/ojph
        ref: libojph
        submodules: recursive
        path: libojph-src
        persist-credentials: false

    - name: Find the libojph revision
      id: libojph
      shell: bash -el {0}
      run: |
        echo "revision=$(git -C libojph-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "compiler=$(${CXX:-c++} --version 2>/dev/null | head -n 1 | tr -c 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"
        if [ "$RUNNER_ARCH" = "X64" ] && [ "$RUNNER_OS" != "macOS" ]; then
          echo "hwy=1.4.0" >> "$GITHUB_OUTPUT"
        else
          echo "hwy=off" >> "$GITHUB_OUTPUT"
        fi

    - name: Restore libojph from the cache
      id: libojph-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: libojph-install
        key: libojph-${{ runner.os }}-${{ runner.arch }}-${{ steps.libojph.outputs.compiler }}-hwy-${{ steps.libojph.outputs.hwy }}-${{ hashFiles('libojph-src/tools/build_hwy.sh') }}-${{ steps.libojph.outputs.revision }}

    - name: Build and install libojph
      if: steps.libojph-cache.outputs.cache-hit != 'true'
      shell: bash -el {0}
      env:
        HWY_VERSION: ${{ steps.libojph.outputs.hwy }}
      run: |
        if [ "$RUNNER_OS" != "Windows" ]; then export CMAKE_GENERATOR=Ninja; fi
        root="$PWD"
        if [ "$RUNNER_OS" = "Windows" ]; then root="$(cygpath -m "$PWD")"; fi
        prefix="$root/libojph-install"
        hwy_options=()
        if [ "$HWY_VERSION" != "off" ]; then
          libojph-src/tools/build_hwy.sh "$HWY_VERSION" "$prefix" "$root/hwy-build"
          hwy_library="$prefix/lib/libhwy.a"
          if [ "$RUNNER_OS" = "Windows" ]; then hwy_library="$prefix/lib/hwy.lib"; fi
          hwy_options=(-DOJPH_ENABLE_HWY=ON -DOJPH_REQUIRE_HWY=ON
                       "-DOJPH_HWY_INCLUDE_DIR=$prefix/include" "-DOJPH_HWY_LIBRARY=$hwy_library")
        fi
        cmake -S libojph-src -B libojph-build \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=OFF \
          -DCMAKE_INSTALL_PREFIX="$prefix" \
          "${hwy_options[@]}"
        cmake --build libojph-build --config Release --parallel
        cmake --install libojph-build --config Release

    - name: Build and install the plugin
      id: plugin
      shell: bash -el {0}
      env:
        COVERAGE: ${{ inputs.coverage }}
      run: |
        coverage_options=()
        if [ "$COVERAGE" = "true" ]; then
          coverage_options=(-DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=--coverage -DCMAKE_MODULE_LINKER_FLAGS=--coverage)
        fi
        if [ "$RUNNER_OS" != "Windows" ]; then export CMAKE_GENERATOR=Ninja; fi
        root="$PWD"
        conda_prefix="$CONDA_PREFIX"
        if [ "$RUNNER_OS" = "Windows" ]; then
          root="$(cygpath -m "$PWD")"
          conda_prefix="$(cygpath -m "$CONDA_PREFIX")/Library"
        fi
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="$root/libojph-install;$conda_prefix" \
          -DCMAKE_INSTALL_PREFIX="$root/install" \
          "${coverage_options[@]}"
        cmake --build build --config Release --parallel
        cmake --install build --config Release
        echo "plugin-dir=$root/install/lib/plugin" >> "$GITHUB_OUTPUT"
        ls -l install/lib/plugin

    - name: Check that the plugin needs no Highway library at run time
      shell: bash -el {0}
      env:
        PLUGIN_DIR: ${{ steps.plugin.outputs.plugin-dir }}
      run: |
        case "$RUNNER_OS" in
          Linux) dependencies="$(ldd "$PLUGIN_DIR"/libh5jpeg2000.so)" ;;
          macOS) dependencies="$(otool -L "$PLUGIN_DIR"/libh5jpeg2000.dylib)" ;;
          Windows)
            vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
            dumpbin="$("$vswhere" -latest -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/dumpbin.exe' | head -n 1 | tr -d '\r')"
            dependencies="$("$dumpbin" /dependents "$PLUGIN_DIR/h5jpeg2000.dll")" ;;
        esac
        echo "$dependencies"
        if echo "$dependencies" | grep -i hwy; then
          echo "the plugin must not depend on a Highway library at run time" >&2
          exit 1
        fi

name: Build the plugin
description: >-
  Install HDF5, h5py, CMake and a compiler from conda-forge, build libojph
  (cached), and build and install the filter plugin.

inputs:
  coverage:
    description: Build the plugin with gcov instrumentation, for a coverage report.
    default: "false"

outputs:
  plugin-dir:
    description: The directory that holds the installed plugin.
    value: ${{ steps.plugin.outputs.plugin-dir }}

runs:
  using: composite
  steps:
    - name: Install the toolchain from conda-forge
      uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
      with:
        environment-name: h5jpeg2000
        create-args: >-
          python=3.13
          hdf5>=2,<3
          h5py
          numpy
          pytest
          ojph
          cmake
          ninja
          pkg-config
          ${{ runner.os != 'Windows' && 'cxx-compiler' || '' }}
          ${{ inputs.coverage == 'true' && 'gcovr' || '' }}
        condarc: |
          channels:
            - conda-forge
          channel_priority: strict
        init-shell: bash
        cache-environment: true
        post-cleanup: none

    - name: Check out libojph
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ramonaoptics/ojph
        ref: libojph
        submodules: recursive
        path: libojph-src
        persist-credentials: false

    - name: Find the libojph revision
      id: libojph
      shell: bash -el {0}
      run: |
        echo "revision=$(git -C libojph-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "compiler=$(${CXX:-c++} --version 2>/dev/null | head -n 1 | tr -c 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"

    - name: Restore libojph from the cache
      id: libojph-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: libojph-install
        key: libojph-${{ runner.os }}-${{ runner.arch }}-${{ steps.libojph.outputs.compiler }}-${{ steps.libojph.outputs.revision }}

    - name: Build and install libojph
      if: steps.libojph-cache.outputs.cache-hit != 'true'
      shell: bash -el {0}
      run: |
        if [ "$RUNNER_OS" != "Windows" ]; then export CMAKE_GENERATOR=Ninja; fi
        root="$PWD"
        if [ "$RUNNER_OS" = "Windows" ]; then root="$(cygpath -m "$PWD")"; fi
        cmake -S libojph-src -B libojph-build \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=OFF \
          -DOJPH_ENABLE_HWY=OFF \
          -DCMAKE_INSTALL_PREFIX="$root/libojph-install"
        cmake --build libojph-build --config Release --parallel
        cmake --install libojph-build --config Release

    - name: Build and install the plugin
      id: plugin
      shell: bash -el {0}
      env:
        COVERAGE: ${{ inputs.coverage }}
      run: |
        coverage_options=()
        if [ "$COVERAGE" = "true" ]; then
          coverage_options=(-DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=--coverage -DCMAKE_MODULE_LINKER_FLAGS=--coverage)
        fi
        if [ "$RUNNER_OS" != "Windows" ]; then export CMAKE_GENERATOR=Ninja; fi
        root="$PWD"
        conda_prefix="$CONDA_PREFIX"
        if [ "$RUNNER_OS" = "Windows" ]; then
          root="$(cygpath -m "$PWD")"
          conda_prefix="$(cygpath -m "$CONDA_PREFIX")/Library"
        fi
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="$root/libojph-install;$conda_prefix" \
          -DCMAKE_INSTALL_PREFIX="$root/install" \
          "${coverage_options[@]}"
        cmake --build build --config Release --parallel
        cmake --install build --config Release
        echo "plugin-dir=$root/install/lib/plugin" >> "$GITHUB_OUTPUT"
        ls -l install/lib/plugin
